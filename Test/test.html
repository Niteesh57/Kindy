<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Animated Human Girl - CSS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;

            background: #ffffff;
            background: radial-gradient(circle at 50% 35%, #ffffff 0%, #f7f9fb 70%, #edf0f5 100%);

            font-family: Arial, sans-serif;
        }

        /* =========================
   CHARACTER
========================= */

        .scene {
            position: relative;
            width: 400px;
            height: 650px;

            animation: floating 4s ease-in-out infinite;
        }

        /* Ground shadow */

        .shadow {
            position: absolute;
            width: 245px;
            height: 35px;

            bottom: 15px;
            left: 50%;

            transform: translateX(-50%);

            background: rgba(0, 0, 0, .08);
            border-radius: 50%;

            filter: blur(10px);
        }

        /* =========================
   HAIR BACK & CROWN
========================= */

        .hair-back {
            position: absolute;
            width: 268px;
            height: 360px;
            top: 32px;
            left: 66px;
            background:
                radial-gradient(ellipse at 50% 15%, #4a2720 0%, #24110f 60%, #160a09 100%);
            border-radius: 50% 50% 42% 42% / 46% 46% 54% 54%;
            box-shadow:
                0 16px 28px rgba(0, 0, 0, .12),
                inset 0 -20px 30px rgba(0, 0, 0, .3);
            z-index: 1;
        }

        /* Long hair flowing over shoulders */

        .hair-strand {
            position: absolute;
            width: 56px;
            height: 265px;
            background:
                linear-gradient(90deg, #1c0d0c 0%, #3e1f19 50%, #1f0e0d 100%);
            border-radius: 50% 50% 46% 46% / 60% 60% 40% 40%;
            z-index: 2;
            box-shadow: 3px 8px 18px rgba(0, 0, 0, .15);
        }

        .hair-strand.left {
            left: 66px;
            top: 115px;
            transform: rotate(8deg);
            animation: hairMoveLeft 3.5s ease-in-out infinite;
        }

        .hair-strand.right {
            right: 66px;
            top: 115px;
            transform: rotate(-8deg);
            animation: hairMoveRight 3.5s ease-in-out infinite;
        }

        /* =========================
   NECK
========================= */

        .neck {
            position: absolute;
            width: 68px;
            height: 85px;
            top: 288px;
            left: 166px;
            background: linear-gradient(90deg, #df9674, #f8bfa0 50%, #df9674);
            border-radius: 18px;
            z-index: 3;
            box-shadow: inset 0 16px 14px rgba(140, 65, 45, .38);
        }

        /* =========================
   EARS
========================= */

        .ear {
            position: absolute;
            width: 28px;
            height: 54px;
            top: 165px;
            background: #f0ac89;
            border-radius: 50%;
            z-index: 3;
            box-shadow:
                inset 2px 2px 6px rgba(255, 255, 255, .25),
                inset -2px -2px 6px rgba(160, 70, 45, .25);
        }

        .ear.left {
            left: 89px;
        }

        .ear.right {
            right: 89px;
        }

        .ear::after {
            content: "";
            position: absolute;
            width: 13px;
            height: 26px;
            top: 14px;
            background: #da8a67;
            border-radius: 50%;
            opacity: 0.55;
        }

        .ear.left::after {
            right: 4px;
        }

        .ear.right::after {
            left: 4px;
        }

        /* =========================
   FACE / HEAD
========================= */

        .face {
            position: absolute;
            width: 194px;
            height: 248px;
            top: 72px;
            left: 103px;

            /* Sculpted oval human face: cranium curve, soft cheek curve, tapered jaw & rounded chin */
            border-radius: 46% 46% 44% 44% / 38% 38% 62% 62%;

            background:
                /* Forehead soft glow */
                radial-gradient(ellipse at 50% 22%, rgba(255, 255, 255, .42) 0%, transparent 42%),
                /* Nose bridge subtle vertical highlight */
                radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, .18) 0%, transparent 25%),
                /* Left cheek warmth */
                radial-gradient(circle at 26% 60%, rgba(245, 125, 115, .22) 0%, transparent 34%),
                /* Right cheek warmth */
                radial-gradient(circle at 74% 60%, rgba(245, 125, 115, .22) 0%, transparent 34%),
                /* 3D Skin depth */
                radial-gradient(circle at 50% 36%, #ffdfd0 0%, #f7bda0 52%, #e29a78 86%, #cb7f5e 100%);

            z-index: 4;

            box-shadow:
                0 18px 25px -6px rgba(135, 60, 40, .32),
                0 8px 18px rgba(0, 0, 0, .08),
                inset 0 3px 12px rgba(255, 255, 255, .45),
                inset 0 -12px 18px rgba(180, 75, 45, .18);
        }

        /* Chin highlight */
        .face::after {
            content: "";
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 44px;
            height: 20px;
            background: radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, .35), transparent 70%);
            border-radius: 50%;
        }

        /* =========================
   FRONT HAIR (ON MARK)
========================= */

        .hair-front {
            position: absolute;
            width: 174px;
            height: 48px;
            top: 58px;
            left: 113px;
            background:
                radial-gradient(ellipse at 50% 25%, rgba(255, 255, 255, .14) 0%, transparent 55%),
                linear-gradient(180deg, #24110f 0%, #46251e 55%, #251210 100%);
            border-radius: 8px 8px 24px 24px / 6px 6px 30px 30px;
            z-index: 6;
            box-shadow: 0 3px 6px rgba(0, 0, 0, .16);
        }

        /* =========================
   EYEBROWS
========================= */

        .brow {
            position: absolute;
            width: 52px;
            height: 10px;
            top: 134px;
            background: linear-gradient(90deg, #24110f 0%, #44231c 55%, #1e0d0b 100%);
            z-index: 12;
            box-shadow: 0 1.5px 3px rgba(60, 20, 10, .25);
            filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .22));
            transition: transform 0.3s ease;
        }

        .brow.left {
            left: 111px;
            border-radius: 6px 24px 2px 7px / 6px 12px 2px 6px;
            transform: rotate(-6deg);
        }

        .brow.right {
            right: 111px;
            border-radius: 24px 6px 7px 2px / 12px 6px 6px 2px;
            transform: rotate(6deg);
        }

        /* Brow-bone subtle highlight underneath arch */
        .brow::after {
            content: "";
            position: absolute;
            bottom: -6px;
            left: 6px;
            width: 38px;
            height: 4px;
            background: radial-gradient(ellipse, rgba(255, 255, 255, .35) 0%, transparent 80%);
            border-radius: 50%;
        }

        /* =========================
   EYELIDS
========================= */

        .eyelid {
            position: absolute;
            width: 44px;
            height: 10px;
            top: 149px;
            border-top: 2px solid rgba(160, 75, 55, .35);
            border-radius: 50%;
            z-index: 11;
            pointer-events: none;
        }

        .eyelid.left {
            left: 115px;
            transform: rotate(-3deg);
        }

        .eyelid.right {
            right: 115px;
            transform: rotate(3deg);
        }

        /* =========================
   EYES
========================= */

        .eye {
            position: absolute;
            width: 51px;
            height: 32px;
            top: 158px;

            /* Natural eye sclera with curvature & lid shadow */
            background: radial-gradient(circle at 50% 80%, #ffffff 65%, #ebdcd5 100%);
            border-radius: 50% 50% 46% 46%;
            overflow: hidden;
            z-index: 12;

            box-shadow:
                0 2px 6px rgba(110, 45, 30, .16),
                inset 0 4px 6px rgba(0, 0, 0, .14);

            animation: blink 5s infinite;
        }

        .eye.left {
            left: 112px;
        }

        .eye.right {
            right: 112px;
        }

        /* Eyelash / Upper lid liner */
        .eye::before {
            content: "";
            position: absolute;
            width: 53px;
            height: 14px;
            top: -6px;
            left: -1px;
            border-top: 3.5px solid #231210;
            border-radius: 50%;
            z-index: 2;
        }

        /* Iris */
        .iris {
            position: absolute;
            width: 25px;
            height: 26px;
            top: 3px;
            left: 13px;
            background:
                radial-gradient(circle at 50% 50%, #110908 0 25%, transparent 26%),
                radial-gradient(circle at 45% 42%, #7a4835 0%, #4a271d 60%, #1e0d0a 100%);
            border-radius: 50%;
            box-shadow: inset 0 0 4px rgba(0, 0, 0, .6);
        }

        /* Primary catchlight */
        .iris::before {
            content: "";
            position: absolute;
            width: 7px;
            height: 7px;
            top: 4px;
            left: 4px;
            background: white;
            border-radius: 50%;
        }

        /* Secondary twinkle catchlight */
        .iris::after {
            content: "";
            position: absolute;
            width: 3.5px;
            height: 3.5px;
            bottom: 5px;
            right: 5px;
            background: rgba(255, 255, 255, .85);
            border-radius: 50%;
        }

        /* =========================
   NOSE
========================= */

        .nose {
            position: absolute;
            width: 22px;
            height: 44px;
            top: 182px;
            left: 189px;
            border-right: 2.5px solid rgba(160, 75, 55, .32);
            border-bottom: 3.5px solid rgba(160, 75, 55, .38);
            border-radius: 0 0 12px 6px;
            z-index: 10;
        }

        /* Nose bridge highlight */
        .nose::before {
            content: "";
            position: absolute;
            width: 8px;
            height: 18px;
            left: 4px;
            top: 4px;
            background: linear-gradient(180deg, rgba(255, 255, 255, .3) 0%, rgba(255, 255, 255, .05) 100%);
            border-radius: 50%;
        }

        /* Nostril shadow */
        .nose::after {
            content: "";
            position: absolute;
            bottom: -2px;
            left: -5px;
            width: 9px;
            height: 5px;
            background: rgba(160, 75, 55, .18);
            border-radius: 50%;
        }

        /* =========================
   BLUSH
========================= */

        .blush {
            position: absolute;
            width: 46px;
            height: 20px;
            top: 212px;
            background: rgba(238, 85, 110, .2);
            border-radius: 50%;
            filter: blur(5px);
            z-index: 9;
        }

        .blush.left {
            left: 114px;
        }

        .blush.right {
            right: 114px;
        }

        /* =========================
   LIPS
========================= */

        .lips {
            position: absolute;
            width: 52px;
            height: 24px;
            top: 240px;
            left: 174px;
            z-index: 12;
        }

        /* Upper lip with cupid's bow */
        .lips::before {
            content: "";
            position: absolute;
            width: 52px;
            height: 12px;
            top: 0;
            left: 0;
            background: linear-gradient(180deg, #db5c73 0%, #b83d56 100%);
            border-radius: 60% 60% 40% 40% / 90% 90% 40% 40%;
            box-shadow: 0 1px 2px rgba(120, 30, 50, .2);
        }

        /* Lower lip plump & gloss */
        .lips::after {
            content: "";
            position: absolute;
            width: 44px;
            height: 13px;
            bottom: 0;
            left: 4px;
            background: radial-gradient(ellipse at 50% 30%, #ff8da2 0%, #d85068 55%, #b3364f 100%);
            border-radius: 30% 30% 65% 65%;
            box-shadow: 0 3px 6px rgba(130, 40, 60, .22);
        }

        /* =========================
   EARRINGS
========================= */

        .earring {
            position: absolute;

            width: 14px;
            height: 25px;

            top: 210px;

            border:
                3px solid #e5b83f;

            border-radius: 50%;

            z-index: 13;
        }

        .earring.left {
            left: 91px;
        }

        .earring.right {
            right: 91px;
        }

        /* =========================
   BODY / DRESS
========================= */

        .body {
            position: absolute;

            width: 225px;
            height: 245px;

            top: 350px;
            left: 87px;

            background:
                linear-gradient(135deg,
                    #7659e8,
                    #a86ce8);

            border-radius:
                80px 80px 25px 25px;

            z-index: 2;

            box-shadow:
                0 10px 20px rgba(0, 0, 0, .12);
        }

        /* Dress detail */

        .dress-line {
            position: absolute;

            width: 4px;
            height: 170px;

            left: 111px;
            top: 30px;

            background: rgba(255, 255, 255, .18);

            border-radius: 10px;
        }

        /* Necklace */

        .necklace {
            position: absolute;

            width: 75px;
            height: 45px;

            left: 162px;
            top: 330px;

            border:
                3px solid #e2b94d;

            border-top: none;

            border-radius:
                0 0 50px 50px;

            z-index: 9;
        }

        .pendant {
            position: absolute;

            width: 13px;
            height: 13px;

            background: #e2b94d;

            border-radius: 50%;

            bottom: -7px;
            left: 28px;
        }

        /* =========================
   ARMS
========================= */

        .arm {
            position: absolute;

            width: 45px;
            height: 170px;

            top: 370px;

            background:
                linear-gradient(90deg,
                    #e5a17c,
                    #ffc5a3,
                    #e5a17c);

            border-radius: 30px;

            z-index: 3;
        }

        .arm.left {
            left: 55px;

            transform:
                rotate(13deg);
        }

        .arm.right {
            right: 55px;

            transform:
                rotate(-13deg);
        }

        /* =========================
   HANDS
========================= */

        .hand {
            position: absolute;

            width: 55px;
            height: 62px;

            top: 520px;

            background: #f0ae88;

            border-radius: 45%;

            z-index: 4;
        }

        .hand.left {
            left: 43px;
        }

        .hand.right {
            right: 43px;
        }

        /* Fingers */

        .finger {
            position: absolute;

            width: 12px;
            height: 36px;

            top: -19px;

            background: #f0ae88;

            border-radius: 10px;
        }

        .hand .finger:nth-child(1) {
            left: 3px;

            transform: rotate(-20deg);
        }

        .hand .finger:nth-child(2) {
            left: 15px;

            transform: rotate(-8deg);
        }

        .hand .finger:nth-child(3) {
            left: 27px;

            transform: rotate(5deg);
        }

        .hand .finger:nth-child(4) {
            left: 39px;

            transform: rotate(18deg);
        }

        /* =========================
   ANIMATIONS
========================= */

        @keyframes floating {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        @keyframes blink {

            0%,
            91%,
            100% {
                transform: scaleY(1);
            }

            94% {
                transform: scaleY(.08);
            }
        }

        @keyframes hairMoveLeft {

            0%,
            100% {
                transform: rotate(8deg);
            }

            50% {
                transform: rotate(13deg);
            }
        }

        @keyframes hairMoveRight {

            0%,
            100% {
                transform: rotate(-8deg);
            }

            50% {
                transform: rotate(-13deg);
            }
        }
    </style>
</head>

<body>

    <div class="scene">

        <div class="shadow"></div>

        <!-- Back Hair -->
        <div class="hair-back"></div>

        <!-- Long Hair -->
        <div class="hair-strand left"></div>
        <div class="hair-strand right"></div>

        <!-- Neck -->
        <div class="neck"></div>

        <!-- Ears -->
        <div class="ear left"></div>
        <div class="ear right"></div>

        <!-- Face -->
        <div class="face"></div>

        <!-- Side Hair Framing -->
        <div class="hair-side left"></div>
        <div class="hair-side right"></div>

        <!-- Eyebrows -->
        <div class="brow left"></div>
        <div class="brow right"></div>

        <!-- Eyelids -->
        <div class="eyelid left"></div>
        <div class="eyelid right"></div>

        <!-- Eyes -->
        <div class="eye left">
            <div class="iris"></div>
        </div>

        <div class="eye right">
            <div class="iris"></div>
        </div>

        <!-- Nose -->
        <div class="nose"></div>

        <!-- Blush -->
        <div class="blush left"></div>
        <div class="blush right"></div>

        <!-- Lips -->
        <div class="lips"></div>

        <!-- Earrings -->
        <div class="earring left"></div>
        <div class="earring right"></div>

        <!-- Necklace -->
        <div class="necklace">
            <div class="pendant"></div>
        </div>

        <!-- Body -->
        <div class="body">
            <div class="dress-line"></div>
        </div>

        <!-- Arms -->
        <div class="arm left"></div>
        <div class="arm right"></div>

        <!-- Hands -->
        <div class="hand left">
            <span class="finger"></span>
            <span class="finger"></span>
            <span class="finger"></span>
            <span class="finger"></span>
        </div>

        <div class="hand right">
            <span class="finger"></span>
            <span class="finger"></span>
            <span class="finger"></span>
            <span class="finger"></span>
        </div>

    </div>

</body>

</html>
